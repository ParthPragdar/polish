name: Bug report
description: Report a reproducible problem using synthetic text.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, real rewrite history, private drafts, or identifying screenshots.
        Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Polish version (shown in the Settings sidebar) or commit, destination app/version, Swift/Xcode version if building from source, and review/automatic mode.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a short synthetic example. State whether text is selected or the whole field is used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message and redacted screenshots if useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed credentials and private text from this report.
          required: true
